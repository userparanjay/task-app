# Start root infra first: cd ../../ && npm run infra:up
services:
  task-service:
    build: .
    container_name: taskflow-task-service
    restart: unless-stopped
    ports:
      - "5004:5004"
    environment:
      PORT: 5004
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tasks_db
      KAFKA_BROKER: kafka:29092
      KAFKA_CLIENT_ID: task-service
    networks:
      - backend-network

networks:
  backend-network:
    external: true
    name: task-app_backend-network
