# Nginx config for domain access (mounted over default.conf in frontend pod)
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: taskflow
data:
  default.conf: |
    server {
        listen 80;
        server_name taskflow.local localhost;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
