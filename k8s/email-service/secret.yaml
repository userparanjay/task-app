# Email credentials — use kubectl create secret (see README); do not commit real passwords
apiVersion: v1
kind: Secret
metadata:
  name: email-service-secret
  namespace: taskflow
type: Opaque
stringData:
  EMAIL_USER: "your-email@gmail.com"
  # Gmail App Password: 16 chars, NO spaces (not your normal Gmail password)
  EMAIL_PASS: "your-16-char-app-password"
  EMAIL_TO: "recipient@example.com"
