# In-cluster DNS: redis-service.taskflow.svc.cluster.local:6379
apiVersion: v1
kind: Service
metadata:
  name: redis-service # hostname for REDIS_URL (redis://redis-service:6379)
  namespace: taskflow
  labels:
    app: redis
spec:
  type: ClusterIP # internal only; compose maps 6380 on host, cluster uses 6379
  selector:
    app: redis # routes to redis pod
  ports:
    - name: redis
      port: 6379 # standard redis port (compose container port)
      targetPort: 6379
