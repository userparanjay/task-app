# Prometheus scrape configuration for the taskflow namespace.
# Mount as prometheus.yml in a Prometheus Deployment (e.g. ConfigMap subPath).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: taskflow
    environment: local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api-gateway
    metrics_path: /meterics
    static_configs:
      - targets: ["api-gateway:5000"]
        labels:
          service: api-gateway

  - job_name: auth-service
    metrics_path: /meterics
    static_configs:
      - targets: ["auth-service:5003"]
        labels:
          service: auth-service

  - job_name: task-service
    metrics_path: /meterics
    static_configs:
      - targets: ["task-service:5004"]
        labels:
          service: task-service

  - job_name: notification-service
    metrics_path: /meterics
    static_configs:
      - targets: ["notification-service:5005"]
        labels:
          service: notification-service

  - job_name: email-service
    metrics_path: /meterics
    static_configs:
      - targets: ["email-service:5006"]
        labels:
          service: email-service

  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - taskflow
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name
