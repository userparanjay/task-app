# Prometheus scrape configuration for the taskflow namespace.
# Mount as prometheus.yml in a Prometheus Deployment (e.g. ConfigMap subPath).
#
# In-cluster DNS targets assume Prometheus runs in namespace: taskflow

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: taskflow
    environment: local

scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # API Gateway — prom-client default + process metrics (path matches app typo)
  - job_name: api-gateway
    metrics_path: /meterics
    static_configs:
      - targets: ["192.168.21.186:5000","192.168.21.186:5001","192.168.21.186:5002","192.168.21.186:5003","192.168.21.186:5004","192.168.21.186:5005","192.168.21.186:3000","192.168.21.186:5006"]
        labels:
          service: api-gateway

  # Pods annotated with prometheus.io/scrape=true
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - taskflow
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name
