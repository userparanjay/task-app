# Kafka UI — mirrors docker-compose kafka-ui (needs healthy kafka broker)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: taskflow
  labels:
    app: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest # same image as compose
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: kafka-ui-config
