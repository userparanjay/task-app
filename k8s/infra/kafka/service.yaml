# DNS name "kafka" — do NOT remove enableServiceLinks:false on Deployment (KAFKA_PORT conflict)
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: taskflow
  labels:
    app: kafka
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
