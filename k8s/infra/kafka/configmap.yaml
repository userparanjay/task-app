# Kafka KRaft broker env — mirrors docker-compose (2 listeners for K8s)
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: taskflow
data:
  KAFKA_NODE_ID: "1"
  KAFKA_PROCESS_ROLES: "broker,controller" # combined mode, single-node dev

  KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
  KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092" # must match Service DNS name

  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@127.0.0.1:9093" # same pod; avoids Service routing loop

  KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  KAFKA_LOG_DIRS: "/var/lib/kafka/data"
  CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
