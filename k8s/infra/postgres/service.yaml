# In-cluster DNS: postgres-service.taskflow.svc.cluster.local:5432
apiVersion: v1
kind: Service
metadata:
  name: postgres-service # hostname apps use in DATABASE_URL
  namespace: taskflow
  labels:
    app: postgres
spec:
  type: ClusterIP # internal only; use port-forward for localhost access
  selector:
    app: postgres # routes traffic to postgres pod
  ports:
    - name: postgres
      port: 5432 # service port (same as compose container port)
      targetPort: 5432 # container port
