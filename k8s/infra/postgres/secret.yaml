# Postgres credentials — same env vars as docker-compose postgres service
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: taskflow # all taskflow workloads live in this namespace
type: Opaque # generic key/value secret
stringData:
  POSTGRES_USER: postgres # default superuser (matches compose)
  POSTGRES_PASSWORD: postgres # dev password (matches compose)
  POSTGRES_DB: taskflow_auth # default DB created on first boot (matches compose)
