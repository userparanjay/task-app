# Postgres server — mirrors docker-compose postgres service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: taskflow
  labels:
    app: postgres
spec:
  replicas: 1 # single DB instance (compose also runs one)
  strategy:
    type: Recreate # avoid two pods fighting over the same PVC
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres # must match Service selector
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine # same image as compose
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: postgres-secret # inject POSTGRES_* env vars
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data # official postgres data path
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/01-init-databases.sql # runs on first init only
              subPath: 01-init-databases.sql # mount single file from ConfigMap
              readOnly: true
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres -d taskflow_auth # same check as compose healthcheck
            initialDelaySeconds: 10 # compose start_period: 10s
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10 # compose retries: 10
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres -d taskflow_auth
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data # bind PVC for durable storage
        - name: init-sql
          configMap:
            name: postgres-init-sql # init SQL from ConfigMap
