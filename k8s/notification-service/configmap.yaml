# Non-secret env — mirrors notification-service docker-compose
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: taskflow
data:
  PORT: "5005"
  NODE_ENV: "production"
  DATABASE_URL: "postgresql://postgres:postgres@postgres-service:5432/notification_db"
  KAFKA_BROKER: "kafka:9092"
  KAFKA_CLIENT_ID: "notification-service"
  KAFKA_CONSUMER_GROUP_ID: "notification-group"
  KAFKA_MAX_RETRY: "3"
  REDIS_URL: "redis://redis-service:6379" # redis-service (compose: redis:6379)
  REDIS_IDEMPOTENCY_KEY_PREFIX: "notification:processed:event:"
  REDIS_IDEMPOTENCY_TTL_SECONDS: "604800"
