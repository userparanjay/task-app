# Routes /api/* to backend services — mirrors api-gateway docker-compose
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: taskflow
data:
  PORT: "5000"
  NODE_ENV: "production"
  HTTP_TIMEOUT_MS: "15000"
  CORS_ORIGIN: "http://taskflow.local" # browser origin when using Ingress domain
  AUTH_SERVICE_URL: "http://auth-service:5003" # K8s Service DNS (compose: taskflow-auth-service)
  TASK_SERVICE_URL: "http://task-service:5004"
  NOTIFICATION_SERVICE_URL: "http://notification-service:5005"
