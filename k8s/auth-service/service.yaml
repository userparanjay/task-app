# In-cluster: auth-service:5003 (api-gateway calls this)
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: taskflow
  labels:
    app: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - name: http
      port: 5003 # fixed: was wrongly 5001
      targetPort: 5003
