apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: taskflow

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service
          image: pnajan/taskflow-auth-service:v1

          ports:
            - containerPort: 5003

          envFrom:
            - configMapRef:
                name: auth-service-config

            - secretRef:
                name: auth-service-secret